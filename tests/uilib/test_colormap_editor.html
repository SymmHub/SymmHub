<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Colormap Editor Test</title>
    <link rel="stylesheet" href="../../lib/uilib/css/uilib.css"/>
    <style>
        body {
            font-family: Verdana, sans-serif;
            background-color: #222;
            color: #eee;
            margin: 20px;
        }
        #controls {
            margin-bottom: 20px;
        }
        button {
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
            border: 1px solid #555;
            background-color: #444;
            color: #fff;
        }
        button:hover {
            background-color: #555;
        }
        #output {
            margin-top: 15px;
            background: #111;
            padding: 10px;
            border-radius: 4px;
            max-width: 600px;
            font-family: monospace;
            font-size: 12px;
            white-space: pre-wrap;
            border: 1px solid #333;
        }
    </style>
</head>
<body>
    <h1>Colormap Editor Test</h1>
    <div id="controls">
        <button id="btnOpen">Open Colormap Editor</button>
    </div>
    <h3>Live Output:</h3>
    <div id="output">Colormap data will appear here when modified...</div>

    <script type="module" src="js/testColormapEditor.js"></script>
</body>
</html>
