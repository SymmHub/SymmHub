<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="Cache-Control" content="no-cache">
        <link rel="icon" type="image/svg+xml" href="./css/icon_symdraw.svg">
        <title>SymDraw Wallpaper Presets</title>
        <meta name="description" content="SymDraw presets with wallpaper symmetry">
        <link rel="stylesheet" href="../../css/thumbnails.css"/>
        <link rel="stylesheet" href="../../css/index.css"/>
    </head>
<body>

    <header>
    <h1>SymDraw with Wallpaper Groups</h1>
    </header>
    <div class="container">
        <p>
        Patterns of the wallpaper groups 632 and *632, most of them in colour
        layers of 3, 4, 6 or 7 colours. A thumbnail opens SymDraw with that preset.
        </p>
        <div id='thumbnails'>
        </div>
    </div>
    <footer>
    <a href='./index.html'>SymDraw</a>
    <a href='../../index.html'>SymmHub</a>
    </footer>
</body>
<script type='module'>
    import { appendThumbnails2 } from './js/modules.js';
    import { presets } from './js/presets_wp.js';

    appendThumbnails2({
        elem:    document.getElementById('thumbnails'),
        page:    'symdraw_wp.html',
        folder:  'presets/wp/',
        target:  'SYMDRAW',
        presetsString: presets,
    });
</script>
</html>
