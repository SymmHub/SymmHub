<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache">
  <link rel="icon" type="image/x-icon" href="./css/icon_symsim.svg">
  <title>SymSim — SymmHub</title>
  <meta name="description" content="Symmetric PDE Simulations">
  <link rel="stylesheet" href="./css/index.css"/>
  <script src="../../css/portal_theme.js"></script>
</head>
<body>
  <nav class="portal-nav" aria-label="SymSim navigation">
    <div class="portal-nav__inner">
      <div class="portal-crumb">
        <a class="portal-brand" href="../../index.html">
          <img src="../../css/icon_symmhub.svg" alt="">
          SymmHub
        </a>
        <span class="portal-crumb__sep" aria-hidden="true">›</span>
        <span class="portal-crumb__current">SymSim</span>
      </div>
      <div class="portal-nav__actions">
        <button type="button" class="theme-btn" data-theme-toggle>☀ Light</button>
      </div>
    </div>
  </nav>

  <main class="container">
    <div class="gallery-toolbar">
      <h1 class="gallery-toolbar__title">SymSim — Symmetric PDE Simulations</h1>
    </div>

    <div class="card-grid">
      <a class="app-card" href="./gray_scott/index.html">
        <div class="app-card__media"><img src="./gray_scott/img/tmb_wp.png" alt="Gray-Scott simulation preview" loading="lazy"></div>
        <div class="app-card__body">
          <div class="app-card__head">
            <span class="app-card__title">Gray-Scott PDE</span>
            <span class="badge">Reaction-Diffusion</span>
          </div>
          <p class="app-card__desc">Wallpaper, conformal map, KLM, and KLMN orbifold reaction-diffusion patterns.</p>
        </div>
      </a>
      <a class="app-card" href="./ginzburg_landau/index.html">
        <div class="app-card__media"><img src="./ginzburg_landau/img/tmb_wp.png" alt="Ginzburg-Landau simulation preview" loading="lazy"></div>
        <div class="app-card__body">
          <div class="app-card__head">
            <span class="app-card__title">Ginzburg-Landau PDE</span>
            <span class="badge">Complex Wave</span>
          </div>
          <p class="app-card__desc">Wallpaper, KLM, KLMN, and 5-generator Kleinian complex wave dynamics.</p>
        </div>
      </a>
    </div>
  </main>

  <footer>
    <a href="../../index.html">SymmHub</a>
  </footer>
</body>
</html>
